version: '3.8'

services:
  magoco:
    build: .
    ports:
      - "9119:9119"
    environment:
      - NODE_ENV=production
      - PORT=9119
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 3s
      retries: 3

<!DOCTYPE html>
<html>
<head>
  <title>MAGoCo - Phase 3 Demo</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .main { display: flex; gap: 20px; }
    .editor-pane { flex: 1; min-width: 400px; }
    .exec-pane { flex: 1; min-width: 300px; }
    .terminal-pane { flex: 1; min-width: 300px; }
    .toolbar { margin-bottom: 10px; }
    .toolbar select, .toolbar button { padding: 5px 10px; margin-right: 5px; }
    #editor-container { height: 400px; border: 1px solid #ccc; }
    .output { background: #1e1e1e; color: #d4d4d4; padding: 10px; min-height: 100px; }
    .terminal-output { background: #000; color: #0f0; padding: 10px; min-height: 100px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>MAGoCo - Phase 3 Demo</h1>
  <div class="main">
    <div class="editor-pane">
      <h2>Editor</h2>
      <div class="toolbar">
        <select id="lang-select">
          <option value="js">JavaScript</option>
          <option value="py">Python</option>
        </select>
        <button id="save-btn">Save</button>
        <button id="run-btn">Run</button>
      </div>
      <div id="editor-container"></div>
    </div>
    <div class="exec-pane">
      <h2>Execution</h2>
      <div class="output" id="exec-output">No execution yet</div>
    </div>
    <div class="terminal-pane">
      <h2>Terminal</h2>
      <button id="term-connect">Connect</button>
      <div class="terminal-output" id="term-output">Disconnected</div>
    </div>
  </div>
  <script type="module">
    const langSelect = document.getElementById('lang-select');
    const saveBtn = document.getElementById('save-btn');
    const runBtn = document.getElementById('run-btn');
    const execOutput = document.getElementById('exec-output');
    const termOutput = document.getElementById('term-output');
    const termConnect = document.getElementById('term-connect');

    let editor;
    let state = { content: 'console.log("Hello");', language: 'js', modified: false };

    // Try Monaco, fallback to textarea
    try {
      await import('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js');
      window.require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
      await new Promise(r => window.require(['vs/editor/editor.main'], r));

      const monaco = window.monaco;
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: state.content,
        language: state.language === 'js' ? 'javascript' : 'python',
        theme: 'vs-dark',
        automaticLayout: true,
      });

      editor.onDidChangeModelContent(() => {
        state.content = editor.getValue();
        state.modified = true;
      });
    } catch {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = state.content;
      ta.style.cssText = 'width:100%;height:400px;font-family:monospace';
      document.getElementById('editor-container').appendChild(ta);
      ta.oninput = () => { state.content = ta.value; state.modified = true; };
      ta.onchange = () => { state.language = langSelect.value; };
    }

    // Run button
    runBtn.onclick = async () => {
      execOutput.textContent = 'Running...';
      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: state.content, language: state.language }),
        });
        const data = await res.json();
        execOutput.textContent = `Exit: ${data.code}\nstdout: ${data.stdout}\nstderr: ${data.stderr}`;
      } catch (e) {
        execOutput.textContent = `Error: ${e.message}`;
      }
    };

    // Terminal connect
    termConnect.onclick = () => {
      const ws = new WebSocket(`ws://${location.host}/terminal`);
      ws.onopen = () => { termOutput.textContent = 'Connected\n'; termConnect.disabled = true; };
      ws.onmessage = (e) => { termOutput.textContent += e.data; };
      ws.onerror = () => { termOutput.textContent += 'Error\n'; };
      ws.onclose = () => { termOutput.textContent += 'Disconnected\n'; };
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>MAGoCo - Code Execution</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .main { display: flex; gap: 20px; }
    .editor-pane, .execution-pane { flex: 1; }
    .execution-controls { margin-bottom: 10px; }
    .execution-output pre { background: #1e1e1e; color: #d4d4d4; padding: 10px; min-height: 100px; }
    textarea { width: 100%; height: 400px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h1>MAGoCo - Code Execution</h1>
  <div class="main">
    <div class="editor-pane">
      <h2>Code Editor</h2>
      <textarea id="code-editor">console.log("Hello from MAGoCo");</textarea>
    </div>
    <div class="execution-pane">
      <h2>Execution</h2>
      <div id="execution-view"></div>
    </div>
  </div>
  <script type="module">
    const editor = document.getElementById('code-editor');
    const execContainer = document.getElementById('execution-view');
    const { renderExecutionView } = await import('./packages/ui/index.js');
    const execView = renderExecutionView(editor);
    execContainer.appendChild(execView);
  </script>
</body>
</html>
